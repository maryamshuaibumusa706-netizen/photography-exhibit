<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lens & Light — Photography Exhibit</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header><h1>📸 Lens & Light</h1><p>A curated photography exhibit — Kano, Lagos & the world.</p></header>
<div class="filters">
  <button class="active" data-filter="all">All</button>
  <button data-filter="city">City</button>
  <button data-filter="nature">Nature</button>
  <button data-filter="people">People</button>
</div>
<main class="gallery">
  <figure data-cat="city"><img src="https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?w=600" alt="City"><figcaption>London Streets</figcaption></figure>
  <figure data-cat="nature"><img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600" alt="Mountain"><figcaption>Mountain Light</figcaption></figure>
  <figure data-cat="people"><img src="https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=600" alt="Portrait"><figcaption>Portrait Study</figcaption></figure>
  <figure data-cat="city"><img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=600" alt="City night"><figcaption>City at Night</figcaption></figure>
  <figure data-cat="nature"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600" alt="Forest"><figcaption>Forest Calm</figcaption></figure>
  <figure data-cat="people"><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=600" alt="Smile"><figcaption>Joy</figcaption></figure>
</main>
<footer><p>Curated by Maryam Shuaib • Built with HTML, CSS & JavaScript</p></footer>
<script src="script.js"></script>
</body>
</html>
